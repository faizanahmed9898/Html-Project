<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LPU Lost & Found | Login / Sign Up</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="navbar">
    <div class="container nav-wrap">
      <a href="index.html" class="brand" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
        <img src="LPU.png" alt="LPU Logo" style="height: 42px; width: auto; background: #fff; padding: 2px; border-radius: 4px;" />
        <span style="color: #fff; font-weight: 700; font-size: 1.1rem; letter-spacing: 0.5px;">LPU FINDHUB</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="search.html">Search Items</a></li>
        <li><a href="auth.html" class="active">Login / Sign Up</a></li>
      </ul>
    </div>
  </header>

  <main class="container">
    <div class="form-card" style="max-width: 480px;">
      <div class="form-header" style="text-align: center;">
        <h2>🎓 University Login</h2>
        <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 4px;">Use your LPU Registration Number or UMS credentials</p>
      </div>

      <form action="index.html" method="get">
        <div class="form-group" style="margin-bottom: 14px;">
          <label for="uid">Registration No. / Employee ID</label>
          <input type="text" id="uid" class="form-control" placeholder="e.g. 12204567" required />
        </div>

        <div class="form-group" style="margin-bottom: 14px;">
          <label for="pwd">Password</label>
          <input type="password" id="pwd" class="form-control" placeholder="••••••••" required />
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
          <label for="role">Portal Role</label>
          <select id="role" class="form-control">
            <option value="student">Student / Scholar</option>
            <option value="faculty">Faculty / Campus Staff</option>
            <option value="moderator">Drop Point Desk Attendant</option>
            <option value="admin">Campus Security Admin</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 12px;">Sign In</button>
        <p style="text-align: center; font-size: 0.85rem; color: var(--text-muted);">
          First time here? <a href="#" style="color: var(--primary); text-decoration: none; font-weight: 600;">Activate via LPU Mail</a>
        </p>
      </form>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 Lovely Professional University</p>
    </div>
  </footer>

</body>
</html>
