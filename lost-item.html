<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LPU Lost & Found | Report Lost Item</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="navbar">
    <div class="container nav-wrap">
      <a href="index.html" class="brand" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
        <img src="LPU.png" alt="LPU Logo" style="height: 42px; width: auto; background: #fff; padding: 2px; border-radius: 4px;" />
        <span style="color: #fff; font-weight: 700; font-size: 1.1rem; letter-spacing: 0.5px;">LPU FINDHUB</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="lost-item.html" class="active">Lost Item</a></li>
        <li><a href="found-item.html">Found Item</a></li>
        <li><a href="search.html">Search Items</a></li>
        <li><a href="my-reports.html">My Reports</a></li>
      </ul>
    </div>
  </header>

  <main class="container">
    <div class="form-card">
      <div class="form-header">
        <h2 style="color: var(--lost-red);">🔴 Report a Lost Item</h2>
        <p style="color: var(--text-muted); font-size: 0.88rem;">Fill out the exact details where you last remember having your item.</p>
      </div>

      <form action="my-reports.html" method="get">
        <div class="form-grid">
          
          <!-- Item Name -->
          <div class="form-group form-col-2">
            <label for="item-name">Item Name *</label>
            <input type="text" id="item-name" class="form-control" placeholder="e.g. Casio Scientific Calculator FX-991EX" required />
          </div>

          <!-- Category -->
          <div class="form-group">
            <label for="category">Category *</label>
            <select id="category" class="form-control" required>
              <option value="">Select Category</option>
              <option value="electronics">Electronics (Laptop, Earbuds, Charger)</option>
              <option value="id-cards">Student / Staff ID Cards</option>
              <option value="stationery">Books, Notes & Stationery</option>
              <option value="bags">Bags, Wallets & Pouches</option>
              <option value="keys">Keys (Room / Bike)</option>
              <option value="bottles">Bottles & Personal Items</option>
            </select>
          </div>

          <!-- Campus Location -->
          <div class="form-group">
            <label for="location">Probable Location at LPU *</label>
            <select id="location" class="form-control" required>
              <option value="">Select Campus Location</option>
              <option value="block34">Block 34 (Computer Science)</option>
              <option value="block36">Block 36 / 38 (Engineering)</option>
              <option value="library">Central Library</option>
              <option value="unimall">UniMall / Food Court</option>
              <option value="unipolis">Baldev Raj Mittal Unipolis</option>
              <option value="hostel-bh">Boys Hostels (BH-1 to BH-8)</option>
              <option value="hostel-gh">Girls Hostels (GH-1 to GH-6)</option>
              <option value="sports">Shanti Devi Mittal Sports Complex</option>
              <option value="grounds">Cricket / Football Grounds</option>
              <option value="other">Campus Bus / Auto Stand</option>
            </select>
          </div>

          <!-- Date / Time -->
          <div class="form-group">
            <label for="lost-date">Date Lost *</label>
            <input type="date" id="lost-date" class="form-control" required />
          </div>

          <div class="form-group">
            <label for="lost-time">Approximate Time</label>
            <input type="time" id="lost-time" class="form-control" />
          </div>

          <!-- Photo Upload -->
          <div class="form-group form-col-2">
            <label for="item-photo">Reference Photo (If available)</label>
            <input type="file" id="item-photo" class="form-control" accept="image/*" />
            <small style="color: var(--text-muted); font-size: 0.76rem; margin-top: 4px;">Uploading a picture significantly increases recovery speed.</small>
          </div>

          <!-- Description -->
          <div class="form-group form-col-2">
            <label for="desc">Detailed Description *</label>
            <textarea id="desc" class="form-control" rows="3" placeholder="Mention color, stickers, scratches, model number, brand, cover style..." required></textarea>
          </div>

        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-danger">Submit Lost Report</button>
          <a href="index.html" class="btn btn-outline">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 Lovely Professional University</p>
    </div>
  </footer>

</body>
</html>
