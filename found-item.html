<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LPU Lost & Found | Report Found Item</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="navbar">
    <div class="container nav-wrap">
     <a href="index.html" class="brand" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
        <img src="LPU.png" alt="LPU Logo" style="height: 42px; width: auto; background: #fff; padding: 2px; border-radius: 4px;" />
        <span style="color: #fff; font-weight: 700; font-size: 1.1rem; letter-spacing: 0.5px;">LPU FINDHUB</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="lost-item.html">Lost Item</a></li>
        <li><a href="found-item.html" class="active">Found Item</a></li>
        <li><a href="search.html">Search Items</a></li>
        <li><a href="my-reports.html">My Reports</a></li>
      </ul>
    </div>
  </header>

  <main class="container">
    <div class="form-card">
      <div class="form-header">
        <h2 style="color: var(--found-green);">🟢 Report a Found Item</h2>
        <p style="color: var(--text-muted); font-size: 0.88rem;">Help a fellow university peer recover their missing property.</p>
      </div>

      <form action="my-reports.html" method="get">
        <div class="form-grid">
          
          <!-- Item Name -->
          <div class="form-group form-col-2">
            <label for="found-name">Item Name / Summary *</label>
            <input type="text" id="found-name" class="form-control" placeholder="e.g. Milton Insulated Water Bottle (Silver)" required />
          </div>

          <!-- Category -->
          <div class="form-group">
            <label for="found-category">Category *</label>
            <select id="found-category" class="form-control" required>
              <option value="">Select Category</option>
              <option value="electronics">Electronics (Laptops, Earbuds, Chargers)</option>
              <option value="id-cards">Student / Staff ID Cards</option>
              <option value="stationery">Stationery & Course Books</option>
              <option value="bags">Bags & Wallets</option>
              <option value="keys">Keys</option>
              <option value="clothing">Jackets & Accessories</option>
            </select>
          </div>

          <!-- Location -->
          <div class="form-group">
            <label for="found-location">Found At (LPU Location) *</label>
            <select id="found-location" class="form-control" required>
              <option value="">Select Where You Found It</option>
              <option value="block34">Block 34 (Computer Science)</option>
              <option value="library">Central Library Reading Room</option>
              <option value="unimall">UniMall Floor / Corridor</option>
              <option value="food-court">Block 34 / 38 Kiosk Area</option>
              <option value="sports-complex">Sports Complex / Gym</option>
              <option value="hostel-mess">Hostel Mess / Common Area</option>
            </select>
          </div>

          <!-- Date / Time -->
          <div class="form-group">
            <label for="found-date">Date Found *</label>
            <input type="date" id="found-date" class="form-control" required />
          </div>

          <div class="form-group">
            <label for="found-time">Time Found</label>
            <input type="time" id="found-time" class="form-control" />
          </div>

          <!-- Photo Upload -->
          <div class="form-group form-col-2">
            <label for="found-photo">Upload Image *</label>
            <input type="file" id="found-photo" class="form-control" accept="image/*" required />
          </div>

          <!-- Description -->
          <div class="form-group form-col-2">
            <label for="found-desc">Description & Drop-off Location *</label>
            <textarea id="found-desc" class="form-control" rows="3" placeholder="Mention item condition and where you currently kept it (e.g. Handed to Block 34 Help Desk or Library Security)." required></textarea>
          </div>

          <!-- Ownership Verification Question -->
          <div class="form-group form-col-2" style="background:#f0fdf4; border:1px dashed var(--found-green); padding:16px; border-radius:8px;">
            <label for="security-q" style="color: #065f46;">Ownership Verification Question (Recommended)</label>
            <input type="text" id="security-q" class="form-control" placeholder="e.g. What is the lockscreen wallpaper? Or what name is written in the notebook?" />
            <small style="color: #047857; font-size: 0.76rem; margin-top: 4px;">Whoever claims this must answer this question correctly before receiving the item.</small>
          </div>

        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-success">Submit Found Report</button>
          <a href="index.html" class="btn btn-outline">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 Lovely Professional University</p>
    </div>
  </footer>

</body>
</html>
